name: API CI and Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Ex-SurveyApp_api/Ex-SurveyApp_api.csproj
      - name: Restore regression runner
        run: dotnet restore tests/QcWorkflowChecks/QcWorkflowChecks.csproj
      - name: Build API
        run: dotnet build Ex-SurveyApp_api/Ex-SurveyApp_api.csproj --no-restore --configuration Release
      - name: Build regression runner
        run: dotnet build tests/QcWorkflowChecks/QcWorkflowChecks.csproj --no-restore --configuration Release
      - name: OTP and bootstrap security checks
        run: |
          dotnet run --no-build --configuration Release --project tests/QcWorkflowChecks/QcWorkflowChecks.csproj -- --bootstrap-checks
          dotnet run --no-build --configuration Release --project tests/QcWorkflowChecks/QcWorkflowChecks.csproj -- --security-checks
          dotnet run --no-build --configuration Release --project tests/QcWorkflowChecks/QcWorkflowChecks.csproj -- --endpoint-scope-checks
          dotnet run --no-build --configuration Release --project tests/QcWorkflowChecks/QcWorkflowChecks.csproj -- --migration-script-check
      - name: Existing regression checks
        run: dotnet run --no-build --configuration Release --project tests/QcWorkflowChecks/QcWorkflowChecks.csproj
      - name: NuGet vulnerability report
        run: dotnet list Ex-SurveyApp_api/Ex-SurveyApp_api.csproj package --vulnerable --include-transitive

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
